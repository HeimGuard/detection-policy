name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sigma rules are converted
        run: |
          pip install pyyaml
          python scripts/sigma2feed.py sigma/*.yml
          git diff --exit-code -- rules parsers
      - name: Validate rules, parsers, fixtures and manifest
        run: python scripts/feed.py check

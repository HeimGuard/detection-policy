name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sigma rules are converted
        run: |
          pip install pyyaml
          python scripts/sigma2feed.py sigma/*.yml
          git diff --exit-code -- rules parsers
      - name: CVE rules are generated from data/cves.json
        run: |
          python scripts/cve2feed.py --offline
          test -z "$(git status --porcelain -- rules tests/fixtures)" || { git status --short -- rules tests/fixtures; exit 1; }
      - name: Tracker rules are generated from data/distro.json
        run: |
          python scripts/distro2feed.py --offline
          test -z "$(git status --porcelain -- rules tests/fixtures)" || { git status --short -- rules tests/fixtures; exit 1; }
      - name: Unit tests of the generator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate rules, parsers, fixtures and manifest
        run: python scripts/feed.py check
      - name: MSRC rules are generated from data/msrc.json
        run: |
          python scripts/msrc2feed.py --offline
          test -z "$(git status --porcelain -- rules tests/fixtures)" || { git status --short -- rules tests/fixtures; exit 1; }
      - name: Unit tests of the generators
        run: python -m unittest discover -s tests -p 'test_*.py'

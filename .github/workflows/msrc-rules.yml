name: msrc-rules

on:
  schedule:
    - cron: '41 3 * * *'   # every night, apart from cve-rules
  workflow_dispatch:
    inputs:
      months:
        description: 'The latest N monthly security updates of Microsoft'
        default: '2'

permissions:
  contents: write
  pull-requests: write

jobs:
  msrc-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate rules from the security updates of Microsoft
        run: python scripts/msrc2feed.py --months "${{ inputs.months || 2 }}"
      - name: Build manifest and validate
        run: |
          python scripts/feed.py build
          python scripts/feed.py check
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/msrc-rules
          commit-message: 'Update the rules of the security updates of Microsoft'
          title: 'Update the rules of the security updates of Microsoft'
          body: |
            Rules generated nightly by `scripts/msrc2feed.py` from the monthly security updates of the MSRC
            (CVRF API): the build of Windows, Microsoft Edge and Visual Studio Code that fixes the CVEs of the
            latest updates. `data/msrc.json` is the state they are generated from. Review the version a rule
            says is the newest fix before merging.
          add-paths: |
            data
            rules
            tests/fixtures
            manifest.json
          delete-branch: true

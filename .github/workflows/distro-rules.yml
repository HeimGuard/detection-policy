name: distro-rules

on:
  schedule:
    - cron: '47 3 * * *'   # every night, after cve-rules
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  distro-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the Ubuntu list is read 20 CVEs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the rules of the Ubuntu and Debian trackers
        run: python scripts/distro2feed.py
      - name: Build manifest and validate
        run: |
          python scripts/feed.py build
          python scripts/feed.py check
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/distro-rules
          commit-message: 'Update the rules of the distribution trackers'
          title: 'Update the rules of the distribution trackers'
          body: |
            Rules generated nightly by `scripts/distro2feed.py` from the Ubuntu CVE tracker and the Debian Security
            Tracker: the critical and high CVEs that a supported release has not fixed (and the ones it fixed lately),
            per source package; data/distro.json is the state they are generated from.
          add-paths: |
            data
            rules
            tests/fixtures
            manifest.json
          delete-branch: true

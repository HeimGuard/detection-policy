name: update-feed

# Every feed generator is a job of its own (cve and msrc in parallel, distro after them); the last job puts what they made together and opens ONE pull request,
# so manifest.json is changed once and not by three pull requests that conflict.
on:
  schedule:
    - cron: '0 0 * * *'   # every night at midnight UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'CVEs of the NVD changed in the last N days'
        default: '4'
      months:
        description: 'The latest N monthly security updates of Microsoft'
        default: '2'

permissions:
  contents: read

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  generate:
    name: generate (${{ matrix.generator }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false   # a generator that fails does not stop the others
      matrix:
        include:
          - generator: cve        # the NVD, and what the Ubuntu tracker says of the packages
            timeout: 60
            command: python scripts/cve2feed.py --days "$DAYS"
            paths: data/cves.json rules/any/org.cve-*.json tests/fixtures/cve-*.json
          - generator: msrc       # the monthly security updates of Microsoft
            timeout: 30
            command: python scripts/msrc2feed.py --months "$MONTHS"
            paths: data/msrc.json rules/*/org.msrc-*.json tests/fixtures/msrc-*.json
    env:
      DAYS: ${{ inputs.days || 4 }}
      MONTHS: ${{ inputs.months || 2 }}
      NVD_API_KEY: ${{ matrix.generator == 'cve' && secrets.NVD_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate
        run: ${{ matrix.command }}
      # What the generator changed, as a patch of its own files only (manifest.json is built by the last job).
      - name: Make a patch
        env:
          PATHS: ${{ matrix.paths }}
        run: |
          set -f   # the patterns are for git, not for the shell
          git add -A -- $PATHS
          git diff --cached --binary > "$RUNNER_TEMP/${{ matrix.generator }}.patch"
          git diff --cached --stat | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: patch-${{ matrix.generator }}
          path: ${{ runner.temp }}/${{ matrix.generator }}.patch
          retention-days: 3

  # The Ubuntu / Debian rules leave out what the rules of the NVD already judge (covered() of distro2feed.py), and feed.py check
  # refuses a CVE in both: so this one runs on top of what the jobs above made, not on the rules of main.
  distro:
    needs: generate
    if: ${{ !cancelled() }}   # also when one of them failed: the rules of main are then what it leaves out
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the Ubuntu tracker list is read 20 CVEs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: patch-*
          merge-multiple: true
          path: ${{ runner.temp }}/patches
      - name: Apply the patches
        run: |
          shopt -s nullglob
          for patch in "$RUNNER_TEMP"/patches/*.patch; do
            if [ -s "$patch" ]; then git apply --index "$patch" && echo "applied $(basename "$patch")"; fi
          done
      - name: Generate
        run: python scripts/distro2feed.py
      - name: Make a patch
        run: |
          git reset -q   # the patches of the jobs above were applied to the index: only what this one changes
          git add -A -- data/distro.json 'rules/linux/org.distro-*.json' 'tests/fixtures/distro-*.json'
          git diff --cached --binary > "$RUNNER_TEMP/distro.patch"
          git diff --cached --stat | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: patch-distro
          path: ${{ runner.temp }}/distro.patch
          retention-days: 3

  pull-request:
    needs: [generate, distro]
    if: ${{ !cancelled() }}   # also when a generator failed: what the others made is still a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: patch-*
          merge-multiple: true
          path: ${{ runner.temp }}/patches
      - name: Apply the patches
        run: |
          shopt -s nullglob
          for patch in "$RUNNER_TEMP"/patches/*.patch; do
            if [ -s "$patch" ]; then git apply --index "$patch" && echo "applied $(basename "$patch")"; fi
          done
      - name: Build manifest and validate
        run: |
          python scripts/feed.py build
          python scripts/feed.py check
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/feed-update
          commit-message: 'Update the rules of the feed'
          title: 'Update the rules of the feed'
          body: |
            Rules generated by `.github/workflows/update-feed.yml`, which runs every night (and on demand):

            - `scripts/cve2feed.py`: new rules for the CVEs the NVD changed (and what the Ubuntu security tracker says about their
              packages). CVEs of one product with the same version ranges are one rule; `data/cves.json` is the state. Review the
              name match and the version range before merging.
            - `scripts/distro2feed.py`: the critical and high CVEs that a supported release has not fixed (and the ones it fixed
              lately), per source package, from the Ubuntu CVE tracker and the Debian Security Tracker; `data/distro.json` is the state.
            - `scripts/msrc2feed.py`: the build of Windows, Microsoft Edge and Visual Studio Code that fixes the CVEs of the latest
              monthly updates of the MSRC (CVRF API); `data/msrc.json` is the state. Review the version a rule says is the newest
              fix before merging.
          add-paths: |
            data
            rules
            tests/fixtures
            manifest.json
          delete-branch: true
      - name: Fail when a generator failed
        if: ${{ needs.generate.result != 'success' || needs.distro.result != 'success' }}
        run: |
          echo "A generator failed: see the jobs 'generate (...)'; the pull request has what the others made."
          exit 1

name: update-feed

# Every feed generator in one run, so that manifest.json is changed by one pull request and not by three that conflict.
on:
  schedule:
    - cron: '0 0 * * *'   # every night at midnight UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'CVEs of the NVD changed in the last N days'
        default: '4'
      months:
        description: 'The latest N monthly security updates of Microsoft'
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # the Ubuntu tracker list is read 20 CVEs at a time (150 minutes of it)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A generator that fails does not stop the others: what the rest produced is still a pull request, and the job ends red.
      - name: CVE rules (NVD)
        id: cve
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/cve2feed.py --days "${{ inputs.days || 4 }}"
      - name: Rules of the Ubuntu and Debian trackers
        id: distro
        continue-on-error: true
        run: python scripts/distro2feed.py
      - name: Rules of the security updates of Microsoft
        id: msrc
        continue-on-error: true
        run: python scripts/msrc2feed.py --months "${{ inputs.months || 2 }}"
      - name: Build manifest and validate
        run: |
          python scripts/feed.py build
          python scripts/feed.py check
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/feed-update
          commit-message: 'Update the rules of the feed'
          title: 'Update the rules of the feed'
          body: |
            Rules generated by `.github/workflows/update-feed.yml`, which runs every night (and on demand):

            - `scripts/cve2feed.py`: new rules for the CVEs the NVD changed (and what the Ubuntu security tracker says about their
              packages). CVEs of one product with the same version ranges are one rule; `data/cves.json` is the state. Review the
              name match and the version range before merging.
            - `scripts/distro2feed.py`: the critical and high CVEs that a supported release has not fixed (and the ones it fixed
              lately), per source package, from the Ubuntu CVE tracker and the Debian Security Tracker; `data/distro.json` is the state.
            - `scripts/msrc2feed.py`: the build of Windows, Microsoft Edge and Visual Studio Code that fixes the CVEs of the latest
              monthly updates of the MSRC (CVRF API); `data/msrc.json` is the state. Review the version a rule says is the newest
              fix before merging.
          add-paths: |
            data
            rules
            tests/fixtures
            manifest.json
          delete-branch: true
      - name: Fail when a generator failed
        if: always() && (steps.cve.outcome == 'failure' || steps.distro.outcome == 'failure' || steps.msrc.outcome == 'failure')
        run: |
          echo "cve2feed: ${{ steps.cve.outcome }}, distro2feed: ${{ steps.distro.outcome }}, msrc2feed: ${{ steps.msrc.outcome }}"
          exit 1

title: macOS MDM Profile Removal via profiles CLI
id: 606abd4b-a7ef-4cd9-b34d-296f3022d525
status: experimental
description: Detects removal of configuration or MDM enrollment profiles using the profiles command, which may indicate an attempt to unenroll a device or bypass MDM-enforced controls.
author: PanoptiPulse
date: 2026-10-06
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_img:
    Image|endswith: '/profiles'
  selection_cli:
    CommandLine|contains:
      - ' remove'
      - ' -R'
  condition: selection_img and selection_cli
falsepositives:
  - Authorized IT administrators decommissioning or re-enrolling a device
  - MDM migration projects
level: high
references:
  - https://support.apple.com/guide/deployment/welcome/web

title: Certutil Download Of Remote File
id: 57b14bc1-e97e-4c1f-a9df-9a020eb284de
status: test
description: Detects certutil used to download a file from a URL.
author: PanoptiPulse
date: 2026-10-06
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\certutil.exe'
  selection_cli:
    CommandLine|contains|all:
      - 'urlcache'
      - 'http'
  filter:
    CommandLine|contains: 'internal.example'
  condition: selection_img and selection_cli and not filter
falsepositives:
  - Administrators fetching certificates
level: high
